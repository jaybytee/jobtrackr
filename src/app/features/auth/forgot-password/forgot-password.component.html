<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">🔑</div>
      <h1>Reset Password</h1>
      <p>We'll email you a reset link</p>
    </div>
    @if (sent()) {
      <div class="success-box">
        <div class="success-icon">📬</div>
        <h3>Email sent!</h3>
        <p>Check your inbox for the reset link.</p>
        <a routerLink="/auth/login" class="btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:1rem">Back to Login</a>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="field">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
        </div>
        @if (error()) { <div class="error-msg">{{ error() }}</div> }
        <button type="submit" class="btn-primary" [disabled]="loading()">
          {{ loading() ? 'Sending...' : 'Send Reset Link' }}
        </button>
        <div class="auth-links">
          <a routerLink="/auth/login">← Back to login</a>
        </div>
      </form>
    }
  </div>
</div>
