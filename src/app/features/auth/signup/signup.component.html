<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <h1>JobTrackr</h1>
      <p>Start tracking your dream job journey</p>
    </div>

    @if (success()) {
      <div class="success-box">
        <div class="success-icon">✅</div>
        <h3>Check your email!</h3>
        <p>We've sent a confirmation link to <strong>{{ email }}</strong></p>
        <a routerLink="/auth/login" class="btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:1rem">Back to Login</a>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="field">
          <label>Email</label>
          <input type="email" [(ngModel)]="email" name="email"
                 placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password"
                 placeholder="Min. 6 characters" required />
        </div>

        @if (error()) {
          <div class="error-msg">{{ error() }}</div>
        }

        <button type="submit" class="btn-primary" [disabled]="loading()">
          {{ loading() ? 'Creating account...' : 'Create Account' }}
        </button>

        <div class="auth-links">
          <span>Already have an account?</span>
          <a routerLink="/auth/login">Sign in</a>
        </div>
      </form>
    }
  </div>
</div>
